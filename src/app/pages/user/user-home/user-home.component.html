<!-- inicio de la pagina -->
<div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold">Panel de Usuario</h1>
    <button (click)="createTicket()" class="bg-green-500 hover:bg-green-600 text-white rounded-md px-4 py-2 font-semibold shadow-sm">Crear Ticket</button>
  </div>

  <div class="my-2">
      <p class="text-gray-500">Bienvenido {{ userName }}. Aquí puedes ver tus tickets.</p>

  </div>
</div>

<!-- Mensajes de carga -->
<div *ngIf="loading" class="text-center text-gray-600 my-4 text-sm">Cargando tickets...</div>
<div *ngIf="!loading && tickets.length === 0" class="text-center text-gray-500 my-4 text-sm">No tienes tickets.</div>

<!-- tabla de tickets -->
<div class=" max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 overflow-x-auto">
  <table *ngIf="!loading && tickets.length > 0" class=" bg-white shadow-lg w-full border border-gray-200">
    <tr class="bg-gray-100">
      <th class="text-sm font-medium text-gray-600 py-3 text-left px-6">Título</th>
      <th class="text-sm font-medium text-gray-600 py-3 text-left px-6">Estado</th>
      <th class="text-sm font-medium text-gray-600 py-3 text-left px-6">Fecha</th>
      <th class="text-sm font-medium text-gray-600 py-3 text-left px-6">Prioridad</th>
      <th class="text-sm font-medium text-gray-600 py-3 text-left px-6">Acciones</th>
    </tr>

    <tr *ngFor="let ticket of tickets" class="border-b hover:bg-gray-100">
      <td class="px-6 py-2 text-sm text-gray-800">{{ ticket.title }}</td>
      <td class="px-6 py-2 text-sm text-gray-800" [ngClass]="getStatusClass(ticket.status)">{{
        getStatusText(ticket.status) }}</td>
      <td class="px-6 py-2 text-sm text-gray-800">{{ ticket.created_at| date }}</td>
      <td class="px-6 py-2 text-sm text-gray-800">{{ getPriorityText(ticket.priority) }}</td>
      <td class="px-6 py-2 text-sm text-gray-800">
        <button [routerLink]="['/ticket', ticket.id]"
          class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded transition-colors">
          Ver
        </button>
      </td>
    </tr>
  </table>
</div>
