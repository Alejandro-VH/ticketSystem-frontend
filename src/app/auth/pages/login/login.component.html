<div class="flex justify-center items-center h-screen bg-blue-500">
    <div class="bg-white w-100 rounded-md p-8 shadow-lg">
        <h1 class="text-2xl block text-center font-bold mb-4">Inicio de sesión</h1>
        <form (ngSubmit)="onSubmit()">
            <div class="mb-4">
                <label for="email" class="block text-base mb-2">Correo electronico</label>
                <input [(ngModel)]="email" name="email" id="email" type="text" placeholder="usuario@ejemplo.com"
                    class="border w-full p-2 rounded text-base focus:outline-none focus:ring-0 placeholder-zinc-500">

            </div>
            <div class="mb-4">
                <label for="password" class="block text-base mb-2">Contraseña</label>
                <input [(ngModel)]="password" name="password" id="password" type="password" placeholder="**********"
                    class="border w-full p-2 mb-4 rounded text-base focus:outline-none focus:ring-0 placeholder-zinc-500">
            </div>
            <div class="mb-2">
                <button type="submit" class="bg-blue-500 text-white text-bold rounded px-4 py-2 justify-center w-full hover:bg-transparent hover:text-blue-500 border-blue-500 border-2">Ingresar</button>
            </div>
        </form>
    </div>
</div>
